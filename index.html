<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Obsidian Clip Studio</title>
<style>
:root{--bg:#0b0c10;--glass:rgba(255,255,255,.05);--line:rgba(255,255,255,.1);--txt:#e8eaf0;--mute:#8b90a0;--a:#7c5cff;--b:#22d3ee}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;color:var(--txt);font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,sans-serif;
background:radial-gradient(900px 500px at 10% -10%,rgba(124,92,255,.25),transparent),radial-gradient(800px 500px at 100% 0,rgba(34,211,238,.15),transparent),var(--bg);
padding:calc(16px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))}
.wrap{max-width:880px;margin:0 auto;display:grid;gap:16px}
h1{font-size:22px;margin:4px 0 0;letter-spacing:-.3px}
h1 span{background:linear-gradient(90deg,var(--a),var(--b));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mute);margin:0;font-size:13px}
.card{background:var(--glass);border:1px solid var(--line);border-radius:18px;padding:16px;-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.card h2{font-size:12px;text-transform:uppercase;letter-spacing:.12em;color:var(--mute);margin:0 0 12px;font-weight:600}
.drop{border:1.5px dashed rgba(255,255,255,.2);border-radius:14px;padding:28px 12px;text-align:center;cursor:pointer;transition:.2s}
.drop.over,.drop:hover{border-color:var(--b);background:rgba(34,211,238,.06)}
.drop b{display:block;font-size:16px}.drop small{color:var(--mute)}
.row{display:flex;gap:8px;margin-top:12px}
input[type=url],select{width:100%;background:rgba(0,0,0,.35);color:var(--txt);border:1px solid var(--line);border-radius:12px;padding:11px 12px;font:inherit;outline:none}
input[type=url]:focus,select:focus{border-color:var(--a)}
button{border:0;border-radius:12px;padding:11px 16px;font:inherit;font-weight:600;color:#fff;cursor:pointer;background:linear-gradient(135deg,var(--a),var(--b));white-space:nowrap}
button.ghost{background:var(--glass);border:1px solid var(--line)}
button:disabled{opacity:.5}
.stage{background:#000;border-radius:14px;overflow:hidden;display:flex;justify-content:center}
video,#imgPrev{max-width:100%;max-height:48vh;display:block}
.hidden{display:none!important}
.sl{margin-top:14px}
.sl label{display:flex;justify-content:space-between;color:var(--mute);font-size:13px}
.sl label em{color:var(--txt);font-style:normal;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--a);margin:6px 0 0}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.grid label{font-size:13px;color:var(--mute);display:block;margin-bottom:5px}
.bar{height:6px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--a),var(--b));transition:width .15s}
#status{color:var(--mute);font-size:13px;margin-top:8px;min-height:20px}
.info{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px;margin-top:12px}.info div{background:rgba(0,0,0,.3);border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:0}.info span{display:block;font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}.info b{font-size:13px;font-weight:600;word-break:break-all}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.85);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);z-index:9;overflow:auto;padding:20px;text-align:center}
#modal img{max-width:100%;border-radius:12px;-webkit-touch-callout:default}
#modal p{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <div><h1><span>Obsidian</span> Clip Studio</h1><p class="sub">Trim video, export GIF · WebP · PNG · JPEG. Everything runs in your browser.</p></div>

  <div class="card">
    <h2>1 · Source</h2>
    <div class="drop" id="drop"><b>Drop a video or image here</b><small>or tap to browse · .mp4 .mov .webm · images</small></div>
    <input id="file" type="file" accept="video/*,image/*,.mp4,.mov,.webm" hidden>
    <div class="row"><input id="url" type="url" placeholder="Direct media link (https://…/clip.mp4)"><button id="loadUrl" class="ghost">Load</button></div>
  </div>

  <div class="card hidden" id="editor">
    <h2>2 · Preview &amp; Trim</h2>
    <div class="stage"><video id="vid" playsinline muted controls preload="auto" crossorigin="anonymous"></video><img id="imgPrev" class="hidden" alt=""></div>
    <div class="info" id="info"></div>
    <div id="trim">
      <div class="sl"><label>Start <em id="sv">0.00s</em></label><input id="start" type="range" min="0" max="1" step="0.01" value="0"></div>
      <div class="sl"><label>End <em id="ev">0.00s</em></label><input id="end" type="range" min="0" max="1" step="0.01" value="1"></div>
      
    </div>
  </div>

  <div class="card hidden" id="export">
    <h2>3 · Export</h2>
    <div class="grid">
      <div><label>Format</label><select id="fmt"><option value="gif">Animated GIF</option><option value="webp">Animated WebP</option><option value="png">Frame PNG</option><option value="jpeg">Frame JPEG</option></select></div>
      <div id="fpsBox"><label>Framerate</label><select id="fps"><option value="24">Smooth · 24 FPS</option><option value="30">Fluid · 30 FPS</option><option value="40">Ultra · 40 FPS</option></select></div>
      <div><label>Resolution</label><select id="res"><option value="0">Original (Native Sharpness)</option><option value="720">720px wide</option><option value="500">500px wide</option></select></div>
    </div>
    <p class="sub" id="est" style="margin-top:12px"></p>
    <div class="row" style="margin-top:6px"><button id="go" style="width:100%">Compile &amp; Export</button></div>
    <button id="cancel" class="ghost hidden" style="width:100%;margin-top:8px">Cancel</button>
    <div class="bar"><i id="prog"></i></div><div id="status"></div><div class="info" id="outinfo" style="margin-top:12px"></div>
  </div>
</div>

<div id="modal" class="hidden"></div>

<script>
const $=id=>document.getElementById(id);
const vid=$('vid'),img=$('imgPrev');
let mode=null; // 'video' | 'image'
let objUrl=null,meta={};

/* ---------- Ingestion ---------- */
const drop=$('drop'),file=$('file');
drop.onclick=()=>file.click();
file.onchange=()=>file.files[0]&&loadFile(file.files[0]);
['dragover','dragenter'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.add('over')}));
['dragleave','drop'].forEach(e=>drop.addEventListener(e,ev=>{ev.preventDefault();drop.classList.remove('over')}));
drop.addEventListener('drop',ev=>{const f=ev.dataTransfer.files[0];f&&loadFile(f)});

function loadFile(f){
  if(objUrl)URL.revokeObjectURL(objUrl);
  objUrl=URL.createObjectURL(f);
  const isImg=f.type.startsWith('image/');
  meta={name:f.name,type:f.type||'unknown',size:f.size,origin:'Local file'};setSource(objUrl,isImg?'image':'video');
}
$('loadUrl').onclick=()=>{
  const u=$('url').value.trim(); if(!u)return;
  const isImg=/\.(png|jpe?g|gif|webp|avif|bmp)(\?|#|$)/i.test(u);
  meta={name:decodeURIComponent(u.split('?')[0].split('/').pop()||u),type:isImg?'image':'video',size:null,origin:'Remote URL'};
  setSource(u,isImg?'image':'video');
  fetch(u,{method:'HEAD'}).then(r=>{const l=+r.headers.get('content-length'),t=r.headers.get('content-type');if(l)meta.size=l;if(t)meta.type=t;renderInfo();}).catch(()=>{});
};
function setSource(src,type){
  mode=type; $('editor').classList.remove('hidden'); $('export').classList.remove('hidden');
  const v=type==='video';
  vid.classList.toggle('hidden',!v); img.classList.toggle('hidden',v); $('trim').classList.toggle('hidden',!v);
  $('fpsBox').classList.toggle('hidden',!v);
  const f=$('fmt'); [...f.options].forEach(o=>{if(v)o.disabled=false;else o.disabled=(o.value==='gif'||o.value==='webp')});
  if(!v&&(f.value==='gif'||f.value==='webp'))f.value='png';
  setStatus('');prog(0);
  if(v){vid.pause();vid.src=src;vid.load();}
  else{img.crossOrigin='anonymous';img.src=src;}
}
img.onload=()=>{renderInfo();updateEst();};
img.onerror=vid.onerror=()=>setStatus('Could not load this media. For links, the host must allow cross-origin (CORS) access.');
vid.onloadedmetadata=()=>{
  const d=vid.duration||0;
  [$('start'),$('end')].forEach(s=>{s.max=d;});
  $('start').value=0;$('end').value=Math.min(d,5)||d;
  syncLabels();vid.currentTime=0;
  renderInfo();updateEst();
};

/* ---------- Trimmer ---------- */
const GAP=0.05;
function syncLabels(){$('sv').textContent=(+$('start').value).toFixed(2)+'s';$('ev').textContent=(+$('end').value).toFixed(2)+'s';
  const l=$('end').value-$('start').value;$('sv').title=`Clip length ${l.toFixed(2)}s`;}
$('start').oninput=()=>{
  let s=+$('start').value,e=+$('end').value;
  if(s>e-GAP){s=Math.max(0,e-GAP);$('start').value=s;}
  syncLabels();vid.pause();vid.currentTime=s;
};
$('end').oninput=()=>{
  let s=+$('start').value,e=+$('end').value;
  if(e<s+GAP){e=Math.min(+$('end').max,s+GAP);$('end').value=e;}
  syncLabels();vid.pause();vid.currentTime=e;
};

/* ---------- Helpers ---------- */
function setStatus(t){$('status').textContent=t}
function prog(p){$('prog').style.width=(p*100)+'%'}
const raf=()=>new Promise(r=>requestAnimationFrame(r));
function seek(t){return new Promise(res=>{
  if(Math.abs(vid.currentTime-t)<0.001){raf().then(res);return;}
  const h=()=>{vid.removeEventListener('seeked',h);raf().then(res)};
  vid.addEventListener('seeked',h);vid.currentTime=t;
});}
function dims(){
  const sw=mode==='video'?vid.videoWidth:img.naturalWidth, sh=mode==='video'?vid.videoHeight:img.naturalHeight;
  const target=+$('res').value;
  const w=target?Math.min(target,sw):sw; // keepAspectRatio
  return {w,h:Math.round(w*sh/sw)};
}
const src=()=>mode==='video'?vid:img;

/* ---------- Info ---------- */
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtB=n=>n<1024?n+' B':n<1048576?(n/1024).toFixed(1)+' KB':(n/1048576).toFixed(2)+' MB';
const fmtT=s=>{const m=Math.floor(s/60);return (m?m+'m ':'')+(s-m*60).toFixed(2)+'s'};
const gcd=(a,b)=>b?gcd(b,a%b):a;
const kv=o=>Object.entries(o).filter(([,v])=>v!=null&&v!=='').map(([k,v])=>`<div><span>${k}</span><b>${v}</b></div>`).join('');
function renderInfo(){
  if(!mode)return;const v=mode==='video';
  const W=v?vid.videoWidth:img.naturalWidth,H=v?vid.videoHeight:img.naturalHeight,d=v?vid.duration:0,g=W&&H?gcd(W,H):1;
  $('info').innerHTML=kv({Name:esc(meta.name||'media'),Source:meta.origin,Type:esc(meta.type||'unknown'),
    'File size':meta.size!=null?fmtB(meta.size):'Unknown (remote)',Dimensions:W?`${W} × ${H}px`:'',Ratio:W?`${W/g}:${H/g}`:'',
    Megapixels:W?(W*H/1e6).toFixed(2)+' MP':'',Duration:v&&d?fmtT(d):'',
    'Avg bitrate':v&&d&&meta.size?((meta.size*8/d)/1e6).toFixed(2)+' Mbps':''});
}
function updateEst(){
  if(!mode)return;const v=mode==='video';
  if(!(v?vid.videoWidth:img.naturalWidth))return;
  const f=$('fmt').value,{w,h}=dims();
  if(!v||f==='png'||f==='jpeg'){$('est').textContent=`Output: 1 still · ${w} × ${h}px`;return;}
  const fps=+$('fps').value,len=Math.max(0,$('end').value-$('start').value),n=Math.max(1,Math.floor(len*fps));
  $('est').textContent=`Output: ${n} frames · ${w} × ${h}px · ${len.toFixed(2)}s`+(n*w*h>3e8?' · ⚠ heavy export, may take a while (streams to stay memory-safe)':'');
}
['start','end','fps','res','fmt'].forEach(id=>['input','change'].forEach(e=>$(id).addEventListener(e,updateEst)));

/* ---------- Byte writer (typed, growable: no giant JS arrays) ---------- */
class BW{
  constructor(n=65536){this.b=new Uint8Array(n);this.n=0}
  ensure(k){if(this.n+k>this.b.length){let m=this.b.length*2;while(m<this.n+k)m*=2;const nb=new Uint8Array(m);nb.set(this.b.subarray(0,this.n));this.b=nb}}
  u8(v){this.ensure(1);this.b[this.n++]=v}
  u16(v){this.u8(v&255);this.u8(v>>8&255)}
  u24(v){this.u16(v&65535);this.u8(v>>16&255)}
  u32(v){this.u16(v&65535);this.u16(v>>>16&65535)}
  raw(a){this.ensure(a.length);this.b.set(a,this.n);this.n+=a.length}
  str(s){for(let i=0;i<s.length;i++)this.u8(s.charCodeAt(i))}
  out(){return this.b.slice(0,this.n)}
}

/* ---------- GIF (streamed per-frame; 216-colour palette) ---------- */
function quantize(data,w,h,out,f){
  if(!f){for(let i=0,p=0;i<w*h;i++,p+=4)out[i]=Math.round(data[p]/51)*36+Math.round(data[p+1]/51)*6+Math.round(data[p+2]/51);return;}
  f.set(data);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    const p=(y*w+x)*4;let r=0;
    for(let c=0;c<3;c++){
      const v=f[p+c]<0?0:f[p+c]>255?255:f[p+c],l=Math.round(v/51),e=v-l*51;
      r=r*6+l;
      if(x+1<w)f[p+4+c]+=e*7/16;
      if(y+1<h){if(x>0)f[p+4*w-4+c]+=e*3/16;f[p+4*w+c]+=e*5/16;if(x+1<w)f[p+4*w+4+c]+=e/16;}
    }
    out[y*w+x]=r;
  }
}
function lzw(idx){
  const o=new BW((idx.length>>2)+1024);let cur=0,bits=0,size=9,next=258,dict=new Map();
  const emit=c=>{cur|=c<<bits;bits+=size;while(bits>=8){o.u8(cur&255);cur>>=8;bits-=8;}};
  emit(256);let pre=idx[0];
  for(let i=1;i<idx.length;i++){
    const k=idx[i],key=pre*256+k,g=dict.get(key);
    if(g!==undefined){pre=g;continue;}
    emit(pre);dict.set(key,next++);
    if(next-1===(1<<size)&&size<12)size++;
    if(next===4096){emit(256);dict.clear();next=258;size=9;}
    pre=k;
  }
  emit(pre);emit(257);if(bits>0)o.u8(cur&255);
  return o.out();
}
function gifHeader(w,h){
  const b=new BW(1024);b.str('GIF89a');b.u16(w);b.u16(h);b.raw([0xF7,0,0]);
  for(let r=0;r<6;r++)for(let g=0;g<6;g++)for(let c=0;c<6;c++)b.raw([r*51,g*51,c*51]);
  for(let i=216;i<256;i++)b.raw([0,0,0]);
  b.raw([0x21,0xFF,11]);b.str('NETSCAPE2.0');b.raw([3,1,0,0,0]);
  return b.out();
}
function gifFrame(idx,w,h,delay){
  const d=lzw(idx),b=new BW(d.length+(d.length/255|0)+64);
  b.raw([0x21,0xF9,4,0]);b.u16(delay);b.raw([0,0]);
  b.u8(0x2C);b.u16(0);b.u16(0);b.u16(w);b.u16(h);b.raw([0,8]);
  for(let p=0;p<d.length;p+=255){const n=Math.min(255,d.length-p);b.u8(n);b.raw(d.subarray(p,p+n));}
  b.u8(0);return b.out();
}

/* ---------- Animated WebP (streamed per-frame) ---------- */
async function webpFrame(cv,w,h,dur){
  const blob=await new Promise(r=>cv.toBlob(r,'image/webp',0.92));
  if(!blob||blob.type!=='image/webp')throw new Error('This browser cannot encode WebP. Use Chrome, Edge or Firefox, or choose GIF.');
  const buf=new Uint8Array(await blob.arrayBuffer()),inner=[];let off=12;
  while(off+8<=buf.length){
    const t=String.fromCharCode(buf[off],buf[off+1],buf[off+2],buf[off+3]),len=(buf[off+4]|buf[off+5]<<8|buf[off+6]<<16|buf[off+7]<<24)>>>0,total=8+len+(len&1);
    if(t!=='VP8X')inner.push(buf.subarray(off,Math.min(off+total,buf.length)));
    off+=total;
  }
  const il=inner.reduce((s,a)=>s+a.length,0),pl=16+il,b=new BW(pl+16);
  b.str('ANMF');b.u32(pl);b.u24(0);b.u24(0);b.u24(w-1);b.u24(h-1);b.u24(dur);b.u8(0);
  inner.forEach(a=>b.raw(a));if(pl&1)b.u8(0);
  return b.out();
}
function webpHeader(w,h,total){
  const b=new BW(64);b.str('RIFF');b.u32(4+18+14+total);b.str('WEBP');
  b.str('VP8X');b.u32(10);b.raw([0x12,0,0,0]);b.u24(w-1);b.u24(h-1);
  b.str('ANIM');b.u32(6);b.raw([255,255,255,255,0,0]);
  return b.out();
}

/* ---------- Export ---------- */
function openWindow(){let w=null;try{w=window.open('','_blank');}catch(e){}
  if(w){w.document.write('<body style="background:#0b0c10;color:#8b90a0;font:16px -apple-system,sans-serif;text-align:center;padding:40px">Compiling…</body>');}
  return w;}
let outUrl=null,cancel=false;
function showResult(win,blob,name,info){
  if(outUrl)URL.revokeObjectURL(outUrl);
  const url=outUrl=URL.createObjectURL(blob);
  $('outinfo').innerHTML=kv(info);
  const rows=Object.entries(info).map(([k,v])=>`<div style="display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid #222"><span style="color:#8b90a0">${k}</span><b>${v}</b></div>`).join('');
  const html=`<meta name="viewport" content="width=device-width,initial-scale=1"><title>${name}</title>
<body style="margin:0;background:#0b0c10;color:#e8eaf0;font:15px -apple-system,sans-serif;text-align:center;padding:20px">
<p style="color:#22d3ee;font-weight:600">Your export is ready</p>
<img src="${url}" style="max-width:100%;border-radius:12px;-webkit-touch-callout:default" alt="${name}">
<p style="color:#8b90a0">📱 Long-press the image → <b>Save to Photos</b> / <b>Save to Files</b><br>🖥 Desktop: <a style="color:#7c5cff" href="${url}" download="${name}">Download file</a></p>
<div style="max-width:420px;margin:0 auto;text-align:left;font-size:14px">${rows}</div></body>`;
  if(win&&!win.closed){win.document.open();win.document.write(html);win.document.close();}
  else{const m=$('modal');m.classList.remove('hidden');
    m.innerHTML=`<p style="color:#22d3ee;font-weight:600">Your export is ready</p><img src="${url}" alt=""><p>Long-press the image → Save to Photos / Files<br><a style="color:#7c5cff" href="${url}" download="${name}">Download file</a></p><button id="cl" class="ghost">Close</button>`;
    $('cl').onclick=()=>m.classList.add('hidden');}
  setStatus(`Done · ${fmtB(blob.size)}`);prog(1);
}
$('cancel').onclick=()=>{cancel=true;setStatus('Cancelling…')};
$('go').onclick=async()=>{
  const fmt=$('fmt').value,win=openWindow(),t0=performance.now();cancel=false;
  $('go').disabled=true;$('cancel').classList.remove('hidden');prog(0);$('outinfo').innerHTML='';
  try{
    const {w,h}=dims(),cv=document.createElement('canvas');cv.width=w;cv.height=h;
    const ctx=cv.getContext('2d',{willReadFrequently:fmt==='gif'});
    let blob,info,name;
    if(fmt==='png'||fmt==='jpeg'){
      setStatus('Capturing frame…');
      if(mode==='video')await seek(+$('start').value);
      if(fmt==='jpeg'){ctx.fillStyle='#000';ctx.fillRect(0,0,w,h);}
      ctx.drawImage(src(),0,0,w,h);
      blob=await new Promise(r=>cv.toBlob(r,'image/'+fmt,0.95));
      if(!blob)throw new Error('Capture failed (the source may block cross-origin pixel access, or the image is too large for this device).');
      name=`frame.${fmt==='jpeg'?'jpg':'png'}`;
      info={Format:fmt.toUpperCase(),Dimensions:`${w} × ${h}px`,'File size':fmtB(blob.size),'Time taken':((performance.now()-t0)/1000).toFixed(1)+'s'};
    }else{
      const fps=+$('fps').value,s=+$('start').value,e=+$('end').value,n=Math.max(1,Math.floor((e-s)*fps));
      const cs=i=>Math.max(2,Math.round((i+1)*100/fps)-Math.round(i*100/fps));
      const ms=i=>Math.max(1,Math.round((i+1)*1000/fps)-Math.round(i*1000/fps));
      const parts=[];let bytes=0;
      const idx=fmt==='gif'?new Uint8Array(w*h):null,fb=fmt==='gif'&&w*h<=1.5e6?new Float32Array(w*h*4):null;
      if(fmt==='gif')parts.push(gifHeader(w,h));
      for(let i=0;i<n;i++){
        if(cancel)throw new Error('Cancelled');
        await seek(Math.min(e,s+i/fps));ctx.drawImage(vid,0,0,w,h);
        let p;
        if(fmt==='gif'){quantize(ctx.getImageData(0,0,w,h).data,w,h,idx,fb);p=gifFrame(idx,w,h,cs(i));}
        else p=await webpFrame(cv,w,h,ms(i));
        parts.push(p);bytes+=p.length;
        prog((i+1)/n*0.97);setStatus(`Frame ${i+1}/${n} · ${fmtB(bytes)} so far`);
        await new Promise(r=>setTimeout(r));
      }
      if(fmt==='gif'){parts.push(new Uint8Array([0x3B]));blob=new Blob(parts,{type:'image/gif'});}
      else blob=new Blob([webpHeader(w,h,bytes),...parts],{type:'image/webp'});
      name=`clip.${fmt}`;
      info={Format:fmt==='gif'?'Animated GIF':'Animated WebP',Dimensions:`${w} × ${h}px`,Frames:n,Framerate:fps+' FPS',Duration:fmtT(n/fps),
        'File size':fmtB(blob.size),'vs source':meta.size?(blob.size/meta.size*100).toFixed(0)+'% of original':'',
        'Time taken':((performance.now()-t0)/1000).toFixed(1)+'s'};
    }
    showResult(win,blob,name,info);
  }catch(err){
    if(win&&!win.closed)win.close();
    setStatus(err.message==='Cancelled'?'Cancelled.':'Error: '+(err.message||err));prog(0);
  }finally{$('go').disabled=false;$('cancel').classList.add('hidden');}
};
</script>
</body>
