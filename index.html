<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinetix — Local Media Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        :root {
            --bg: #07080a;
            --surface: #12141c;
            --surface-glass: rgba(18, 20, 28, 0.85);
            --border: rgba(255, 255, 255, 0.08);
            --accent: #38bdf8;
            --accent-glow: rgba(56, 189, 248, 0.15);
            --success: #34d399;
            --text: #f1f5f9;
            --text-dim: #94a3b8;
        }

        * { box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 24px 16px;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.04) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.03) 0%, transparent 40%);
        }

        .studio-card {
            width: 100%;
            max-width: 440px;
            background-color: var(--surface-glass);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border);
            padding: 28px;
            border-radius: 24px;
            box-shadow: 0 20px 40px -15px rgba(0, 0, 0, 0.7);
        }

        .header {
            text-align: center;
            margin-bottom: 24px;
        }

        .header h1 {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.025em;
            margin: 0 0 6px 0;
            background: linear-gradient(135deg, #fff 30%, var(--text-dim));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header p {
            font-size: 12px;
            color: var(--text-dim);
            margin: 0;
        }

        .input-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            margin-bottom: 8px;
            color: var(--text-dim);
        }

        .file-drop {
            position: relative;
            border: 1px dashed var(--border);
            background: rgba(255, 255, 255, 0.02);
            border-radius: 12px;
            padding: 14px;
            text-align: center;
            transition: all 0.2s ease;
        }

        .file-drop:hover {
            border-color: var(--accent);
            background: var(--accent-glow);
        }

        input[type="file"] {
            width: 100%;
            opacity: 0;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            cursor: pointer;
        }

        .file-drop-text {
            font-size: 13px;
            color: var(--text);
            font-weight: 500;
            pointer-events: none;
        }

        input[type="text"], select {
            width: 100%;
            padding: 12px 14px;
            border-radius: 12px;
            border: 1px solid var(--border);
            background: rgba(0, 0, 0, 0.3);
            color: var(--text);
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input[type="text"]:focus, select:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .divider {
            display: flex;
            align-items: center;
            text-align: center;
            margin: 16px 0;
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: var(--text-dim);
        }

        .divider::before, .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid var(--border);
        }

        .divider::before { margin-right: 12px; }
        .divider::after { margin-left: 12px; }

        .btn-primary {
            width: 100%;
            padding: 13px;
            border-radius: 12px;
            border: none;
            background: linear-gradient(135deg, #38bdf8, #0284c7);
            color: #0f172a;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            box-shadow: 0 4px 12px rgba(56, 189, 248, 0.25);
            transition: transform 0.1s ease, opacity 0.2s;
        }

        .btn-primary:active { transform: scale(0.98); }
        .btn-primary:hover { opacity: 0.92; }

        .media-preview-container {
            width: 100%;
            margin-top: 18px;
            border-radius: 14px;
            overflow: hidden;
            background: #000;
            border: 1px solid var(--border);
            display: none;
            text-align: center;
        }

        video, img {
            width: 100%;
            max-height: 240px;
            object-fit: contain;
            display: block;
            margin: 0 auto;
        }

        .trimmer-box {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 16px;
            margin-top: 16px;
            display: none;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: var(--text-dim);
            margin-bottom: 10px;
            font-weight: 600;
        }

        .slider-group {
            margin-bottom: 10px;
        }
        .slider-group:last-child { margin-bottom: 0; }

        .slider-group label {
            font-size: 10px;
            margin-bottom: 4px;
        }

        input[type="range"] {
            width: 100%;
            accent-color: var(--accent);
            cursor: pointer;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        #status {
            margin-top: 16px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            word-break: break-all;
        }

        .output-box {
            margin-top: 18px;
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.3);
            border-radius: 14px;
            padding: 14px;
            border: 1px solid rgba(52, 211, 153, 0.3);
        }

        .btn-download {
            background: linear-gradient(135deg, #34d399, #059669);
            color: #064e3b;
            margin-top: 12px;
            box-shadow: 0 4px 12px rgba(52, 211, 153, 0.25);
        }
    </style>
</head>
<body>

<div class="studio-card">
    <div class="header">
        <h1>Kinetix Studio</h1>
        <p>Multi-Format Client-Side Converter</p>
    </div>
    
    <div class="input-group">
        <label>Source Video / Image</label>
        <div class="file-drop">
            <span class="file-drop-text" id="fileNameDisplay">Tap to choose file...</span>
            <input type="file" id="fileInput" accept="video/*,image/*" onchange="updateFileLabel(this)">
        </div>
    </div>

    <div class="divider">Or Remote Link</div>

    <div class="input-group">
        <label>Media URL or X/Twitter Post</label>
        <input type="text" id="urlInput" placeholder="https://x.com/... or direct .mp4">
    </div>

    <button class="btn-primary" onclick="loadMedia()">Initialize Stream</button>

    <!-- Preview Box -->
    <div id="previewContainer" class="media-preview-container">
        <video id="videoElement" controls playsinline></video>
        <img id="imageElement" style="display: none;">
    </div>

    <!-- Trimmer -->
    <div id="trimmerBox" class="trimmer-box">
        <div class="timeline-header">
            <span>Frame Trimmer</span>
            <span id="timeRangeDisplay" style="color: var(--accent);">0.0s - 3.0s</span>
        </div>
        <div class="slider-group">
            <label>Start Point</label>
            <input type="range" id="startSlider" min="0" max="10" step="0.1" value="0" oninput="handleStartSlider(this.value)">
        </div>
        <div class="slider-group">
            <label>End Point</label>
            <input type="range" id="endSlider" min="0" max="10" step="0.1" value="3" oninput="handleEndSlider(this.value)">
        </div>
    </div>

    <!-- Settings -->
    <div class="editor-grid">
        <div class="input-group">
            <label for="exportFormat">Output Format</label>
            <select id="exportFormat">
                <option value="gif" selected>Animated GIF</option>
                <option value="webp">Animated WebP</option>
                <option value="png">Frame PNG</option>
                <option value="jpg">Frame JPEG</option>
            </select>
        </div>
        <div class="input-group">
            <label for="gifQuality">Resolution Quality</label>
            <select id="gifQuality">
                <option value="original" selected>Original (Native)</option>
                <option value="500">High (500px)</option>
                <option value="720">Ultra HD (720px)</option>
            </select>
        </div>
    </div>

    <button class="btn-primary" style="margin-top: 8px;" onclick="processAndExportMedia()">Compile & Export</button>
    
    <div id="status"></div>

    <div id="outputContainer" class="output-box">
        <p style="font-size: 11px; color: var(--text-dim); margin: 0 0 8px 0; text-transform: uppercase; letter-spacing: 0.05em;" id="outputLabel">Preview — Long-press to Save</p>
        <img id="finalGifPreview" style="max-width: 100%; border-radius: 10px; margin-bottom: 8px;">
        <button class="btn-primary btn-download" onclick="triggerDownload()">Open Standalone Export</button>
    </div>
</div>

<script>
    let activeSourceType = null;
    let videoDuration = 0;
    let savedOutputData = null;
    let currentMimeType = "image/gif";
    const videoElem = document.getElementById('videoElement');
    const imgElem = document.getElementById('imageElement');
    const previewBox = document.getElementById('previewContainer');
    const trimmerBox = document.getElementById('trimmerBox');
    const statusDiv = document.getElementById('status');
    const outputContainer = document.getElementById('outputContainer');
    const finalGifPreview = document.getElementById('finalGifPreview');

    function updateFileLabel(input) {
        if (input.files && input.files[0]) {
            document.getElementById('fileNameDisplay').innerText = input.files[0].name;
        }
    }

    async function loadMedia() {
        const fileInput = document.getElementById('fileInput').files[0];
        const urlInput = document.getElementById('urlInput').value.trim();

        statusDiv.innerHTML = "";
        outputContainer.style.display = "none";

        if (fileInput) {
            const objectUrl = URL.createObjectURL(fileInput);
            if (fileInput.type.startsWith('video/')) {
                setupVideoPreview(objectUrl);
            } else {
                setupImagePreview(objectUrl);
            }
            return;
        }

        if (!urlInput) {
            alert('Please select a file or paste a link.');
            return;
        }

        statusDiv.innerHTML = "<span style='color: var(--accent);'>Resolving secure stream...</span>";

        if (urlInput.includes("x.com") || urlInput.includes("twitter.com")) {
            try {
                const apiEndpoint = urlInput.replace("x.com", "api.vxtwitter.com").replace("twitter.com", "api.vxtwitter.com");
                const res = await fetch(apiEndpoint);
                const data = await res.json();
                if (data.media_extended && data.media_extended.length > 0) {
                    const directUrl = data.media_extended[0].url;
                    setupVideoPreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(directUrl));
                    statusDiv.innerHTML = "";
                    return;
                }
            } catch (e) {}
        }

        if (urlInput.match(/\.(mp4|webm|ogg|mov)$/i) || urlInput.includes("video")) {
            setupVideoPreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(urlInput));
            statusDiv.innerHTML = "";
        } else {
            setupImagePreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(urlInput));
            statusDiv.innerHTML = "";
        }
    }

    function setupVideoPreview(src) {
        activeSourceType = 'video';
        imgElem.style.display = 'none';
        videoElem.style.display = 'block';
        previewBox.style.display = 'block';
        trimmerBox.style.display = 'block';

        videoElem.crossOrigin = "anonymous";
        videoElem.src = src;
        videoElem.onloadedmetadata = function() {
            videoDuration = videoElem.duration || 10;
            const startSlider = document.getElementById('startSlider');
            const endSlider = document.getElementById('endSlider');

            startSlider.max = videoDuration;
            endSlider.max = videoDuration;
            startSlider.value = 0;
            endSlider.value = Math.min(videoDuration, 3);

            updateTrimRangeDisplay();
        };

        videoElem.onerror = function() {
            statusDiv.innerHTML = "<span style='color: #ef4444;'>Stream restricted. Upload video file directly.</span>";
        };
    }

    function setupImagePreview(src) {
        activeSourceType = 'image';
        videoElem.style.display = 'none';
        imgElem.style.display = 'block';
        previewBox.style.display = 'block';
        trimmerBox.style.display = 'none';

        imgElem.crossOrigin = "anonymous";
        imgElem.src = src;
    }

    function handleStartSlider(val) {
        let start = parseFloat(val);
        let end = parseFloat(document.getElementById('endSlider').value);

        if (start >= end) {
            end = Math.min(videoDuration, start + 0.5);
            document.getElementById('endSlider').value = end;
        }

        videoElem.currentTime = start;
        updateTrimRangeDisplay();
    }

    function handleEndSlider(val) {
        let end = parseFloat(val);
        let start = parseFloat(document.getElementById('startSlider').value);

        if (end <= start) {
            start = Math.max(0, end - 0.5);
            document.getElementById('startSlider').value = start;
        }

        videoElem.currentTime = end;
        updateTrimRangeDisplay();
    }

    function updateTrimRangeDisplay() {
        const start = parseFloat(document.getElementById('startSlider').value);
        const end = parseFloat(document.getElementById('endSlider').value);
        document.getElementById('timeRangeDisplay').innerText = start.toFixed(1) + 's - ' + end.toFixed(1) + 's';
    }

    function processAndExportMedia() {
        if (!activeSourceType) {
            alert('Please load a media source first!');
            return;
        }

        const format = document.getElementById('exportFormat').value;
        statusDiv.innerHTML = "<span style='color: var(--accent);'>Compiling full duration frames... Please wait.</span>";
        outputContainer.style.display = "none";

        const qualitySetting = document.getElementById('gifQuality').value;
        const sourceWidth = activeSourceType === 'video' ? videoElem.videoWidth : imgElem.naturalWidth;
        const sourceHeight = activeSourceType === 'video' ? videoElem.videoHeight : imgElem.naturalHeight;

        let w, h;
        if (qualitySetting === 'original' || !sourceWidth || !sourceHeight) {
            w = sourceWidth || 480;
            h = sourceHeight || 480;
        } else {
            const maxDim = parseInt(qualitySetting);
            w = maxDim;
            h = maxDim;
            const ratio = sourceWidth / sourceHeight;
            if (ratio > 1) {
                h = Math.round(maxDim / ratio);
            } else {
                w = Math.round(maxDim * ratio);
            }
        }

        if (format === 'png' || format === 'jpg') {
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');

            if (activeSourceType === 'video') {
                videoElem.currentTime = parseFloat(document.getElementById('startSlider').value);
            }

            setTimeout(() => {
                const sourceEl = activeSourceType === 'video' ? videoElem : imgElem;
                ctx.drawImage(sourceEl, 0, 0, w, h);
                currentMimeType = format === 'png' ? 'image/png' : 'image/jpeg';
                savedOutputData = canvas.toDataURL(currentMimeType, 0.95);

                finalGifPreview.src = savedOutputData;
                document.getElementById('outputLabel').innerText = "Preview Frame — Long-press to Save";
                outputContainer.style.display = "block";
                statusDiv.innerHTML = "<span style='color: var(--success);'>Frame captured successfully!</span>";
            }, 300);
            return;
        }

        currentMimeType = format === 'webp' ? 'image/webp' : 'image/gif';
        
        if (activeSourceType === 'video') {
            const start = parseFloat(document.getElementById('startSlider').value);
            const end = parseFloat(document.getElementById('endSlider').value);
            const duration = Math.max(end - start, 0.5);
            
            // Dynamic frame allocation matching full trim duration
            const calculatedFrames = Math.floor(duration * 10);

            gifshot.createGIF({
                video: [videoElem.src],
                offset: start,
                numFrames: calculatedFrames,
                interval: 0.1,
                gifWidth: w,
                gifHeight: h,
                keepAspectRatio: true,
                numWorkers: 2
            }, handleMediaResult);
        } else {
            gifshot.createGIF({
                images: [imgElem.src],
                interval: 0.1,
                gifWidth: w,
                gifHeight: h,
                keepAspectRatio: true
            }, handleMediaResult);
        }
    }

    function handleMediaResult(obj) {
        if (!obj.error && obj.image) {
            statusDiv.innerHTML = "<span style='color: var(--success);'>Export compiled successfully!</span>";
            savedOutputData = obj.image;
            
            finalGifPreview.src = obj.image;
            document.getElementById('outputLabel').innerText = "Preview — Long-press to Save";
            outputContainer.style.display = "block";
        } else {
            statusDiv.innerHTML = "<span style='color: #ef4444;'>Encoding failed. Adjust settings and retry.</span>";
        }
    }

    function triggerDownload() {
        if (!savedOutputData) return;
        const win = window.open();
        if (win) {
            win.document.write('<body style="margin:0;background:#000;display:flex;justify-content:center;align-items:center;height:100vh;"><img src="' + savedOutputData + '" style="max-width:100%;max-height:100%;border-radius:8px;" /></body>');
            win.document.title = "Kinetix Export — Long press to save";
        }
    }
</script>

</body>
</html>
