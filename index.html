<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local GIF Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gifshot/0.3.2/gifshot.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #3b82f6;
            --accent-purple: #8b5cf6;
            --text-color: #f8fafc;
            --border-color: #334155;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background-color: var(--card-bg);
            padding: 24px;
            border-radius: 20px;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
            box-sizing: border-box;
        }

        h2 { text-align: center; margin-top: 0; margin-bottom: 20px; font-size: 20px; }

        .input-group { margin-bottom: 16px; }

        label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #94a3b8; }

        input[type="text"], input[type="file"], select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background: #0f172a;
            color: #fff;
            font-size: 14px;
            box-sizing: border-box;
        }

        .media-preview-container {
            width: 100%;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            background: #000;
            display: none;
            text-align: center;
            position: relative;
        }

        video, img { max-width: 100%; max-height: 220px; display: block; margin: 0 auto; }

        .ios-trimmer {
            background: #0f172a;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 14px;
            margin-top: 16px;
            display: none;
        }

        .timeline-header {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #cbd5e1;
            margin-bottom: 8px;
            font-weight: 500;
        }

        .editor-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }

        button {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: none;
            background: var(--accent-blue);
            color: white;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
            margin-top: 16px;
            transition: background 0.2s ease;
        }

        button:hover { background: #2563eb; }

        .download-btn { background: var(--accent-purple); display: none; margin-top: 10px; }
        .download-btn:hover { background: #7c3aed; }

        #status { margin-top: 16px; text-align: center; font-size: 14px; word-break: break-all; }

        #outputGifContainer {
            margin-top: 15px;
            display: none;
            text-align: center;
            background: #0f172a;
            border-radius: 12px;
            padding: 10px;
            border: 1px dashed var(--accent-purple);
        }
        
        .divider {
            text-align: center;
            margin: 12px 0;
            font-size: 12px;
            color: #64748b;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Local GIF Studio</h2>
    
    <div class="input-group">
        <label>Upload Video or Image File</label>
        <input type="file" id="fileInput" accept="video/*,image/*">
    </div>

    <div class="divider">— OR PASTE LINK —</div>

    <div class="input-group">
        <label>Media Link or X/Twitter Post URL</label>
        <input type="text" id="urlInput" placeholder="Paste X, MP4, or image link...">
    </div>

    <button onclick="loadMedia()">Load Media</button>

    <!-- Media Preview Box -->
    <div id="previewContainer" class="media-preview-container">
        <video id="videoElement" controls playsinline></video>
        <img id="imageElement" style="display: none;">
    </div>

    <!-- Video Trimmer -->
    <div id="iosTrimmerBox" class="ios-trimmer">
        <div class="timeline-header">
            <span>Trim Selection</span>
            <span id="timeRangeDisplay">0.0s - 3.0s</span>
        </div>
        <div class="input-group" style="margin-bottom: 8px;">
            <label style="font-size:11px;">Start Time (s)</label>
            <input type="range" id="startSlider" min="0" max="10" step="0.1" value="0" oninput="handleStartSlider(this.value)">
        </div>
        <div class="input-group" style="margin-bottom: 0;">
            <label style="font-size:11px;">End Time (s)</label>
            <input type="range" id="endSlider" min="0" max="10" step="0.1" value="3" oninput="handleEndSlider(this.value)">
        </div>
    </div>

    <!-- Settings Editor -->
    <div class="editor-grid">
        <div class="input-group">
            <label for="gifSpeed">Playback Speed</label>
            <select id="gifSpeed">
                <option value="0.2">0.5x (Smooth)</option>
                <option value="0.1" selected>1.0x (Normal)</option>
                <option value="0.05">2.0x (Fast)</option>
            </select>
        </div>
        <div class="input-group">
            <label for="gifQuality">Resolution Size</label>
            <select id="gifQuality">
                <option value="150">150 px (Small)</option>
                <option value="250" selected>250 px (Medium)</option>
                <option value="400">400 px (Large)</option>
            </select>
        </div>
    </div>

    <button onclick="processAndExportGif()">Generate GIF</button>
    
    <div id="status"></div>

    <div id="outputGifContainer">
        <p style="font-size: 12px; color: #94a3b8; margin-bottom: 8px;">Long-press image to Save to Photos or tap button below</p>
        <img id="finalGifPreview" style="max-width: 100%; border-radius: 8px;">
        <button id="downloadBtn" class="download-btn" onclick="triggerDownload()">Save GIF to Device</button>
    </div>
</div>

<script>
    let activeSourceType = null;
    let videoDuration = 0;
    let savedBase64Data = null;
    const videoElem = document.getElementById('videoElement');
    const imgElem = document.getElementById('imageElement');
    const previewBox = document.getElementById('previewContainer');
    const trimmerBox = document.getElementById('iosTrimmerBox');
    const statusDiv = document.getElementById('status');
    const downloadBtn = document.getElementById('downloadBtn');
    const outputContainer = document.getElementById('outputGifContainer');
    const finalGifPreview = document.getElementById('finalGifPreview');

    async function loadMedia() {
        const fileInput = document.getElementById('fileInput').files[0];
        const urlInput = document.getElementById('urlInput').value.trim();

        statusDiv.innerHTML = "";
        outputContainer.style.display = "none";

        if (fileInput) {
            const objectUrl = URL.createObjectURL(fileInput);
            if (fileInput.type.startsWith('video/')) {
                setupVideoPreview(objectUrl);
            } else {
                setupImagePreview(objectUrl);
            }
            return;
        }

        if (!urlInput) {
            alert('Please select a file or paste a link.');
            return;
        }

        statusDiv.innerHTML = "<p style='color: #3b82f6;'>Resolving media stream...</p>";

        if (urlInput.includes("x.com") || urlInput.includes("twitter.com")) {
            try {
                const apiEndpoint = urlInput.replace("x.com", "api.vxtwitter.com").replace("twitter.com", "api.vxtwitter.com");
                const res = await fetch(apiEndpoint);
                const data = await res.json();
                if (data.media_extended && data.media_extended.length > 0) {
                    const directUrl = data.media_extended[0].url;
                    setupVideoPreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(directUrl));
                    statusDiv.innerHTML = "";
                    return;
                }
            } catch (e) {}
        }

        if (urlInput.match(/\.(mp4|webm|ogg|mov)$/i) || urlInput.includes("video")) {
            setupVideoPreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(urlInput));
            statusDiv.innerHTML = "";
        } else {
            setupImagePreview("https://api.allorigins.win/raw?url=" + encodeURIComponent(urlInput));
            statusDiv.innerHTML = "";
        }
    }

    function setupVideoPreview(src) {
        activeSourceType = 'video';
        imgElem.style.display = 'none';
        videoElem.style.display = 'block';
        previewBox.style.display = 'block';
        trimmerBox.style.display = 'block';

        videoElem.crossOrigin = "anonymous";
        videoElem.src = src;
        videoElem.onloadedmetadata = function() {
            videoDuration = videoElem.duration || 10;
            const startSlider = document.getElementById('startSlider');
            const endSlider = document.getElementById('endSlider');

            startSlider.max = videoDuration;
            endSlider.max = videoDuration;
            startSlider.value = 0;
            endSlider.value = Math.min(videoDuration, 3);

            updateTrimRangeDisplay();
        };

        videoElem.onerror = function() {
            statusDiv.innerHTML = "<p style='color: #ef4444;'>Stream restricted. Upload video file directly from your device.</p>";
        };
    }

    function setupImagePreview(src) {
        activeSourceType = 'image';
        videoElem.style.display = 'none';
        imgElem.style.display = 'block';
        previewBox.style.display = 'block';
        trimmerBox.style.display = 'none';

        imgElem.crossOrigin = "anonymous";
        imgElem.src = src;
    }

    function handleStartSlider(val) {
        let start = parseFloat(val);
        let end = parseFloat(document.getElementById('endSlider').value);

        if (start >= end) {
            end = Math.min(videoDuration, start + 0.5);
            document.getElementById('endSlider').value = end;
        }

        videoElem.currentTime = start;
        updateTrimRangeDisplay();
    }

    function handleEndSlider(val) {
        let end = parseFloat(val);
        let start = parseFloat(document.getElementById('startSlider').value);

        if (end <= start) {
            start = Math.max(0, end - 0.5);
            document.getElementById('startSlider').value = start;
        }

        videoElem.currentTime = end;
        updateTrimRangeDisplay();
    }

    function updateTrimRangeDisplay() {
        const start = parseFloat(document.getElementById('startSlider').value);
        const end = parseFloat(document.getElementById('endSlider').value);
        document.getElementById('timeRangeDisplay').innerText = start.toFixed(1) + 's - ' + end.toFixed(1) + 's';
    }

    function processAndExportGif() {
        if (!activeSourceType) {
            alert('Please load a media source first!');
            return;
        }

        statusDiv.innerHTML = "<p style='color: #3b82f6;'>Encoding frames locally...</p>";
        outputContainer.style.display = "none";
        downloadBtn.style.display = "none";

        const dimension = parseInt(document.getElementById('gifQuality').value);
        const speedInterval = parseFloat(document.getElementById('gifSpeed').value);

        if (activeSourceType === 'video') {
            const start = parseFloat(document.getElementById('startSlider').value);
            const end = parseFloat(document.getElementById('endSlider').value);
            const duration = Math.max(end - start, 0.5);

            gifshot.createGIF({
                video: [videoElem.src],
                offset: start,
                numFrames: Math.floor(duration * 10),
                interval: speedInterval,
                gifWidth: dimension,
                gifHeight: dimension,
                numWorkers: 2
            }, handleGifResult);
        } else {
            const canvas = document.createElement('canvas');
            canvas.width = dimension;
            canvas.height = dimension;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(imgElem, 0, 0, dimension, dimension);

            gifshot.createGIF({
                images: [canvas.toDataURL('image/jpeg', 0.7)],
                interval: speedInterval,
                gifWidth: dimension,
                gifHeight: dimension
            }, handleGifResult);
        }
    }

    function handleGifResult(obj) {
        if (!obj.error && obj.image) {
            statusDiv.innerHTML = "<p style='color: #34d399;'>GIF successfully created!</p>";
            savedBase64Data = obj.image;
            
            finalGifPreview.src = obj.image;
            outputContainer.style.display = "block";
            downloadBtn.style.display = "block";
        } else {
            statusDiv.innerHTML = "<p style='color: #ef4444;'>Encoding failed. Try adjusting trim range.</p>";
        }
    }

    async function triggerDownload() {
        if (!savedBase64Data) return;

        try {
            // Convert Base64 data string to a clean binary Blob
            const arr = savedBase64Data.split(',');
            const mime = arr[0].match(/:(.*?);/)[1];
            const bstr = atob(arr[1]);
            let n = bstr.length;
            const u8arr = new Uint8Array(n);
            while (n--) {
                u8arr[n] = bstr.charCodeAt(n);
            }
            const blob = new Blob([u8arr], { type: mime });

            // Direct File System Access API (Works on modern browsers / Chrome / Edge)
            if (window.showSaveFilePicker) {
                const handle = await window.showSaveFilePicker({
                    suggestedName: 'local_creation.gif',
                    types: [{
                        description: 'GIF Image',
                        accept: { 'image/gif': ['.gif'] },
                    }],
                });
                const writable = await handle.createWritable();
                await writable.write(blob);
                await writable.close();
                return;
            }

            // iOS Safari & Mobile Fallback: Direct Anchor Download using Object URL
            const blobUrl = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.style.display = 'none';
            a.href = blobUrl;
            a.download = 'local_creation.gif';
            document.body.appendChild(a);
            a.click();
            
            setTimeout(() => {
                document.body.removeChild(a);
                URL.revokeObjectURL(blobUrl);
            }, 1000);

        } catch (err) {
            // Fallback if user cancels picker or download stream errors
            console.log("Download action completed or dismissed.");
        }
    }
</script>

</body>
</html>
