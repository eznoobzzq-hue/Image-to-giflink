<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Image → GIF</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fff;--fg:#111;--card:#f2f2f5;--ac:#5865f2}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1a1e;--fg:#f2f2f2;--card:#2a2a30}}
:root[data-theme="dark"]{--bg:#1a1a1e;--fg:#f2f2f2;--card:#2a2a30}
body{margin:0;padding:20px;background:var(--bg);color:var(--fg);font-family:-apple-system,system-ui,sans-serif;max-width:480px;margin:auto}
h1{font-size:24px}.card{background:var(--card);border-radius:14px;padding:16px;margin:14px 0}
button,label.b{display:block;width:100%;box-sizing:border-box;text-align:center;background:var(--ac);color:#fff;border:0;border-radius:12px;padding:14px;font-size:16px;margin:8px 0}
input[type=text]{width:100%;box-sizing:border-box;padding:12px;border-radius:10px;border:1px solid #8884;font-size:16px;background:var(--bg);color:var(--fg)}
img{max-width:100%;border-radius:10px}small{opacity:.7}
</style></head><body>
<h1>Image → GIF</h1>
<div class="card">
<label class="b">Pick an image<input id="f" type="file" accept="image/*" hidden></label>
<small>or try an image link (may be blocked by the site):</small>
<input id="u" type="text" placeholder="https://...">
<button id="go" style="background:#666">Convert link</button>
</div>
<div id="out" class="card" style="display:none">
<img id="p"><button id="sh">Share / Save GIF</button>
<a id="dl" download="image.gif"><button style="background:#666">Download</button></a>
<small id="info"></small>
</div>
<script>
const $=id=>document.getElementById(id);let blob;
function lzw(ix){const out=[];let bb=0,bc=0;const w=(c,s)=>{bb|=c<<bc;bc+=s;while(bc>=8){out.push(bb&255);bb>>>=8;bc-=8}};
const d=new Map();let nx=258,sz=9;w(256,sz);let pre=ix[0];
for(let i=1;i<ix.length;i++){const k=ix[i],key=pre*256+k;
if(d.has(key))pre=d.get(key);else{w(pre,sz);
if(nx<4096){d.set(key,nx++);if(nx>=(1<<sz)&&sz<12)sz++}else{w(256,sz);d.clear();nx=258;sz=9}
pre=k}}
w(pre,sz);w(257,sz);if(bc>0)out.push(bb&255);return out}
function gif(W,H,rgba){const ix=new Uint8Array(W*H);
for(let i=0;i<W*H;i++){const a=rgba[i*4+3]/255;const r=rgba[i*4]*a+255*(1-a),g=rgba[i*4+1]*a+255*(1-a),b=rgba[i*4+2]*a+255*(1-a);
ix[i]=((r>>5)<<5)|((g>>5)<<2)|(b>>6)}
const o=[...'GIF89a'].map(c=>c.charCodeAt(0));o.push(W&255,W>>8,H&255,H>>8,0xF7,0,0);
for(let i=0;i<256;i++)o.push(Math.round(((i>>5)&7)*255/7),Math.round(((i>>2)&7)*255/7),Math.round((i&3)*255/3));
o.push(0x2C,0,0,0,0,W&255,W>>8,H&255,H>>8,0,8);
const data=lzw(ix);for(let i=0;i<data.length;i+=255){const c=data.slice(i,i+255);o.push(c.length,...c)}
o.push(0,0x3B);return new Blob([new Uint8Array(o)],{type:'image/gif'})}
function convert(img){const s=Math.min(1,480/img.naturalWidth);const W=Math.round(img.naturalWidth*s),H=Math.round(img.naturalHeight*s);
const c=document.createElement('canvas');c.width=W;c.height=H;const x=c.getContext('2d');x.drawImage(img,0,0,W,H);
let px;try{px=x.getImageData(0,0,W,H).data}catch(e){alert("That site blocks reading its image. Save it to Photos and use the picker instead.");return}
blob=gif(W,H,px);const url=URL.createObjectURL(blob);$('p').src=url;$('dl').href=url;
$('info').textContent=W+'×'+H+' · '+Math.round(blob.size/1024)+' KB';$('out').style.display='block'}
function load(src,cors){const i=new Image();if(cors)i.crossOrigin='anonymous';i.onload=()=>convert(i);i.onerror=()=>alert("Couldn't load that image. Try the picker.");i.src=src}
$('f').onchange=e=>{const f=e.target.files[0];if(f)load(URL.createObjectURL(f))};
$('go').onclick=()=>{const v=$('u').value.trim();if(v)load(v,true)};
$('sh').onclick=async()=>{const f=new File([blob],'image.gif',{type:'image/gif'});
try{if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f]});else $('dl').click()}catch(e){}};
</script></body></html>
